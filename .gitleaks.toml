[extend]
useDefault = true

[[rules]]
id = "costep-session-key"
description = "CoStep session encryption key assignment"
regex = '''(?i)SESSION_ENCRYPTION_KEY\s*[:=]\s*["']?([A-Za-z0-9+/]{43}=)'''
secretGroup = 1

[[rules]]
id = "costep-smtp-password"
description = "CoStep Gmail SMTP app password assignment"
regex = '''(?i)RECOVERY_SMTP_PASSWORD\s*[:=]\s*["']?([a-z]{16}|[a-z]{4} [a-z]{4} [a-z]{4} [a-z]{4})\b'''
secretGroup = 1

[[rules]]
id = "costep-supabase-secret"
description = "Supabase server secret key"
regex = '''\b(sb_secret_[A-Za-z0-9_-]{20,})'''
secretGroup = 1
