name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 20 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: Git history secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan complete fetched history (redacted, offline)
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="--all" --redact --no-banner --exit-code 1'
